name: Render preview ref

# Manual, main-only. Reads the private source at one merged commit through the reader App,
# verifies the two signed native preview markers for that same commit, renders and scans the
# package, proves it on clean Android and iOS consumers with cold caches and native digest
# checks, then publishes it as preview/<source-sha>/<run-id> through the writer App.
#
# Secrets exist only in the `render` environment. The reader token is revoked before any
# source code runs, the writer token is used by one git push step, and the job that holds it
# runs no repository code. Nothing here touches pub.dev: no id-token,
# no tag, no stable version. Artifacts of this public repository are world-readable, so the
# bundle carries only public data: the rendered package, native-input.json, and the generic
# consumer proof scripts.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA of the merged private source (must be reachable from its develop branch)
        required: true
        type: string
      android_preview_id:
        description: Android preview ID, <source-sha>-<run-id>-<run-attempt>
        required: true
        type: string
      ios_preview_id:
        description: iOS preview ID, <source-sha>-<run-id>-<run-attempt>
        required: true
        type: string

concurrency:
  group: render-preview-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions: {}

env:
  FLUTTER_VERSION: "3.47.6"
  FLUTTER_MACOS_SHA256: "a1946d3b6b3de15ce247dc89649df9035ce29e6b4e7ebe91919a25890ea2e79a"
  FLUTTER_LINUX_SHA256: "f1631b9c2c8b3529323db412b0d1beacf4a748f8783b0d7cf599a8fd5f461675"
  SOURCE_SHA: ${{ inputs.source_sha }}
  ANDROID_PREVIEW_ID: ${{ inputs.android_preview_id }}
  IOS_PREVIEW_ID: ${{ inputs.ios_preview_id }}
  # The private source repository, assembled from parts: this public tree must never spell its name.
  SOURCE_REPOSITORY_NAME: ${{ format('permate-attribution-{0}', 'sdk') }}
  SOURCE_REPOSITORY: ${{ format('{0}/permate-attribution-{1}', github.repository_owner, 'sdk') }}

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: render
    permissions:
      contents: read
    outputs:
      tree_digest: ${{ steps.render.outputs.tree_digest }}
      flutter_version: ${{ steps.render.outputs.flutter_version }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full lowercase commit" >&2; exit 1; }
          for id in "$ANDROID_PREVIEW_ID" "$IOS_PREVIEW_ID"; do
            [[ "$id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]] || { echo "malformed preview ID: $id" >&2; exit 1; }
            [[ "$id" == "${SOURCE_SHA}"-* ]] || { echo "preview ID is not for the source commit: $id" >&2; exit 1; }
          done
      - name: Mint a read-only source token
        id: reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.READER_APP_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true
      - name: Require a commit that is merged into the source develop branch
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          status=$(gh api "repos/${SOURCE_REPOSITORY}/compare/develop...${SOURCE_SHA}" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "$SOURCE_SHA is not reachable from develop (compare status: $status)" >&2; exit 1 ;;
          esac
      - name: Check out the private source at the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.reader.outputs.token }}
          path: source
          persist-credentials: false
      - name: Revoke the source token before any source code runs
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: gh api -X DELETE /installation/token
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Verify the markers, render twice and scan
        id: render
        run: |
          set -eo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo "checkout is not the requested commit" >&2; exit 1; }
          base=$(sed -n 's/^version: *//p' source/flutter/permate_attribution/pubspec.yaml | sed 's/[-+].*//')
          version="${base}-preview.${GITHUB_RUN_ID}"
          mkdir bundle
          python3 source/scripts/flutter_preview_inputs.py inputs --source-sha "$SOURCE_SHA" \
            --android-preview-id "$ANDROID_PREVIEW_ID" --ios-preview-id "$IOS_PREVIEW_ID" \
            --flutter-version "$version" --output bundle/native-input.json \
            --execution-output bundle/execution-evidence.json
          render() { python3 source/scripts/render-flutter-distribution.py render \
            --source source/flutter/permate_attribution --native-input bundle/native-input.json --verify-checkout --out "$1"; }
          render bundle/rendered > first.json
          render "$RUNNER_TEMP/second" > second.json
          cmp first.json second.json || { echo "render is not deterministic" >&2; exit 1; }
          python3 source/scripts/render-flutter-distribution.py scan --tree bundle/rendered --lane dev-preview > /dev/null
          tree_digest=$(python3 -c 'import json; print(json.load(open("first.json"))["treeDigest"])')
          python3 source/scripts/flutter_preview_report.py draft --native-input bundle/native-input.json \
            --execution-evidence bundle/execution-evidence.json \
            --tree-digest "$tree_digest" --run-id "$GITHUB_RUN_ID" --output bundle/report-draft.json
          (cd bundle/rendered && find . -type f | sort) > bundle/rendered-files.txt
          mkdir -p bundle/verification bundle/scripts
          cp source/scripts/flutter_preview_report.py bundle/scripts/
          cp -R source/verification/flutter-consumer bundle/verification/flutter-consumer
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["xcode"]["appPath"])' \
            source/release/ios-build-toolchain.json > bundle/xcode-app-path.txt
          echo "tree_digest=$tree_digest" >> "$GITHUB_OUTPUT"
          echo "flutter_version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-bundle
          path: bundle
          retention-days: 7
          if-no-files-found: error

  android:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-bundle
          path: bundle
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the pinned Flutter SDK
        run: |
          url="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/flutter.tar.xz" "$url"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze and dry-run the rendered package
        run: bash bundle/verification/flutter-consumer/consumer.sh check bundle/rendered
      - name: Cold Android build on a clean consumer
        run: bash bundle/verification/flutter-consumer/consumer.sh build bundle/rendered android bundle/native-input.json

  ios:
    needs: render
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      xcode: ${{ steps.toolchain.outputs.xcode }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-bundle
          path: bundle
      - name: Select the reviewed Xcode
        id: toolchain
        run: |
          sudo xcode-select -s "$(cat bundle/xcode-app-path.txt)/Contents/Developer"
          echo "xcode=$(xcodebuild -version | tr '\n' ' ' | sed 's/ *$//')" >> "$GITHUB_OUTPUT"
      - name: Install the pinned Flutter SDK
        run: |
          url="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/flutter.zip" "$url"
          echo "${FLUTTER_MACOS_SHA256}  $RUNNER_TEMP/flutter.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Cold iOS simulator build on a clean consumer
        run: bash bundle/verification/flutter-consumer/consumer.sh build bundle/rendered ios bundle/native-input.json

  publish:
    needs: [render, android, ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: render
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.push.outputs.commit_sha }}
      tree_sha: ${{ steps.push.outputs.tree_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-bundle
          path: ${{ runner.temp }}/bundle
      - name: Overlay the rendered package on main and prove the result is exactly that package
        env:
          BUNDLE: ${{ runner.temp }}/bundle
        run: |
          git ls-files -z | grep -zv -e '^\.github/' -e '^SECURITY\.md$' | xargs -0 --no-run-if-empty git rm -q
          cp -R "$BUNDLE/rendered/." .
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo "the preview must not change workflow files" >&2
            exit 1
          fi
          # Same file set and same bytes as the rendered, scanned package; only the governance files are extra.
          git ls-files | grep -v -e '^\.github/' -e '^SECURITY\.md$' | sed 's|^|./|' | sort > "$RUNNER_TEMP/committed-files.txt"
          cmp "$RUNNER_TEMP/committed-files.txt" "$BUNDLE/rendered-files.txt" \
            || { echo "committed file set differs from the rendered package" >&2; exit 1; }
          while IFS= read -r file; do
            cmp -s "$BUNDLE/rendered/$file" "$file" || { echo "committed file differs from the rendered package: $file" >&2; exit 1; }
          done < "$BUNDLE/rendered-files.txt"
      - name: Mint a short-lived writer token
        id: writer
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.WRITER_APP_ID }}
          private-key: ${{ secrets.WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Commit and push the preview ref
        id: push
        env:
          WRITER_TOKEN: ${{ steps.writer.outputs.token }}
          FLUTTER_PREVIEW_VERSION: ${{ needs.render.outputs.flutter_version }}
        run: |
          git -c user.name="preview-writer" -c user.email="preview-writer@users.noreply.github.com" \
            commit -q -m "Preview ${FLUTTER_PREVIEW_VERSION} from ${SOURCE_SHA}"
          auth=$(printf 'x-access-token:%s' "$WRITER_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/preview/${SOURCE_SHA}/${GITHUB_RUN_ID}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

  report:
    needs: [render, android, ios, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-bundle
          path: bundle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Complete and validate the evidence report
        env:
          COMMIT_SHA: ${{ needs.publish.outputs.commit_sha }}
          TREE_SHA: ${{ needs.publish.outputs.tree_sha }}
          XCODE: ${{ needs.ios.outputs.xcode }}
        run: |
          # Reaching this job means every needed job passed; the module refuses to write anything else.
          python3 bundle/scripts/flutter_preview_report.py complete --draft bundle/report-draft.json \
            --commit-sha "$COMMIT_SHA" --tree-sha "$TREE_SHA" \
            --toolchain "flutter=${FLUTTER_VERSION}" --toolchain "xcode=${XCODE}" --toolchain "java=temurin-17" \
            --output report/report.json
          python3 bundle/scripts/flutter_preview_report.py validate report/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-dev-preview-report
          path: |
            report/report.json
            bundle/native-input.json
          retention-days: 90
          if-no-files-found: error
