name: Demo consumer

# Manual, main-only. Proves one published Flutter commit on a clean consumer app, on standard runners: the pinned
# commit's identity, cold Android and iOS builds from the committed lockfile, the resolved native digests, runtime
# smoke on an emulator and a simulator, and the documented rollback. The demo (its pubspec.yaml, pubspec.lock and
# pin record) is read from the private source at one merged commit through the reader App; the reader token is revoked
# before anything from the source runs. Nothing here writes to this repository, mints a writer token, touches pub.dev,
# or needs a credential: the demo resolves the package from this public repository by exact commit over HTTPS.
#
# refresh_lock=true only generates pubspec.lock for the pinned commit as an artifact, to be committed to the source.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA of the merged private source that holds the demo (must be reachable from its develop branch)
        required: true
        type: string
      refresh_lock:
        description: Only generate pubspec.lock for the pinned commit (uploaded as an artifact) instead of proving the demo
        required: false
        default: false
        type: boolean

concurrency:
  group: demo-consumer-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions: {}

env:
  FLUTTER_VERSION: "3.47.6"
  FLUTTER_MACOS_SHA256: "a1946d3b6b3de15ce247dc89649df9035ce29e6b4e7ebe91919a25890ea2e79a"
  FLUTTER_LINUX_SHA256: "f1631b9c2c8b3529323db412b0d1beacf4a748f8783b0d7cf599a8fd5f461675"
  SOURCE_SHA: ${{ inputs.source_sha }}
  # The private source repository, assembled from parts: this public tree must never spell its name.
  SOURCE_REPOSITORY_NAME: ${{ format('permate-attribution-{0}', 'sdk') }}
  SOURCE_REPOSITORY: ${{ format('{0}/permate-attribution-{1}', github.repository_owner, 'sdk') }}

jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: render
    permissions:
      contents: read
    steps:
      - name: Check the input
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full lowercase commit" >&2; exit 1; }
      - name: Mint a read-only source token
        id: reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.READER_APP_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true
      - name: Require a commit that is merged into the source develop branch
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          status=$(gh api "repos/${SOURCE_REPOSITORY}/compare/develop...${SOURCE_SHA}" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "$SOURCE_SHA is not reachable from develop (compare status: $status)" >&2; exit 1 ;;
          esac
      - name: Check out the private source at the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.reader.outputs.token }}
          path: source
          persist-credentials: false
      - name: Revoke the source token before anything from the source runs
        if: always()
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: gh api -X DELETE /installation/token
      - name: Bundle the demo and the generic consumer scripts (public data only)
        run: |
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo "checkout is not the requested commit" >&2; exit 1; }
          mkdir bundle
          cp -R source/verification/flutter-consumer bundle/flutter-consumer
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["xcode"]["appPath"])' \
            source/release/ios-build-toolchain.json > bundle/xcode-app-path.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-bundle
          path: bundle
          retention-days: 7
          if-no-files-found: error

  lock:
    needs: source
    if: inputs.refresh_lock == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: demo-bundle
          path: bundle
      - name: Install the pinned Flutter SDK
        run: |
          url="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/flutter.tar.xz" "$url"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve the pinned commit without a lockfile
        run: bash bundle/flutter-consumer/demo/demo.sh lock "$RUNNER_TEMP/lock"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-pubspec-lock
          path: ${{ runner.temp }}/lock/pubspec.lock
          retention-days: 7
          if-no-files-found: error

  android:
    needs: source
    if: inputs.refresh_lock == false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: demo-bundle
          path: bundle
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the pinned Flutter SDK
        run: |
          url="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/flutter.tar.xz" "$url"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Pin identity, before any dependency resolution
        run: bash bundle/flutter-consumer/demo/demo.sh pin-check
      - name: Cold Android build from the committed lockfile, native digest check
        run: bash bundle/flutter-consumer/demo/demo.sh build android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot an Android emulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$sdk/cmdline-tools/latest/bin:$sdk/platform-tools:$sdk/emulator:$PATH"
          image="system-images;android-34;google_apis;x86_64"
          ls -l /dev/kvm
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "emulator" "platform-tools" "$image" > /dev/null
          echo no | avdmanager create avd --name demo --package "$image" --device pixel_6 --force
          nohup emulator -avd demo -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -accel on -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          booted=""
          for _ in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then echo "the emulator process exited" >&2; break; fi
            if [[ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then booted=1; break; fi
            sleep 5
          done
          if [[ -z "$booted" ]]; then
            echo "the emulator did not boot; log tail:" >&2
            tail -n 80 "$RUNNER_TEMP/emulator.log" >&2
            adb devices -l >&2 || true
            exit 1
          fi
          adb devices
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Runtime smoke on the emulator
        timeout-minutes: 25
        run: bash bundle/flutter-consumer/demo/demo.sh smoke android emulator-5554
      - name: Emulator diagnostics
        if: failure() || cancelled()
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tail -n 80 "$RUNNER_TEMP/emulator.log" || true
          "$sdk/platform-tools/adb" devices -l || true
          "$sdk/platform-tools/adb" logcat -d 2>/dev/null | tail -n 150 || true
      - name: Rollback and rebuild without the dependency
        run: bash bundle/flutter-consumer/demo/demo.sh rollback android

  ios:
    needs: source
    if: inputs.refresh_lock == false
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: demo-bundle
          path: bundle
      - name: Select the reviewed Xcode
        run: sudo xcode-select -s "$(cat bundle/xcode-app-path.txt)/Contents/Developer"
      - name: Install the pinned Flutter SDK
        run: |
          url="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/flutter.zip" "$url"
          echo "${FLUTTER_MACOS_SHA256}  $RUNNER_TEMP/flutter.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Pin identity, before any dependency resolution
        run: bash bundle/flutter-consumer/demo/demo.sh pin-check
      - name: Cold iOS simulator build from the committed lockfile, native digest check
        run: bash bundle/flutter-consumer/demo/demo.sh build ios
      - name: Boot an iOS simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime in sorted(devices, reverse=True) if "iOS" in runtime for d in devices[runtime] if d["name"].startswith("iPhone")))
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Runtime smoke on the simulator
        timeout-minutes: 25
        run: bash bundle/flutter-consumer/demo/demo.sh smoke ios "$SIMULATOR_UDID"
      - name: Simulator diagnostics
        if: failure() || cancelled()
        run: |
          xcrun simctl list devices booted || true
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 30m --style compact 2>/dev/null | tail -n 250 || true
          ls -lt "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -n 10 || true
      - name: Rollback and rebuild without the dependency
        run: bash bundle/flutter-consumer/demo/demo.sh rollback ios
