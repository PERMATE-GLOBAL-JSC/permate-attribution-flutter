name: Render production release candidate
run-name: Production render ${{ inputs.source_sha }} by ${{ github.actor }}

# Manual, main-only. Reads the private source at one reviewed commit through the reader App, re-verifies the two
# pinned native releases from public bytes (signed markers, every object digest, registered keys, the iOS wrapper
# tag and the Apple code signature), renders and scans the package twice, builds the candidate manifest, proves the
# package on clean Android and iOS consumers with cold caches and native digest checks, commits the candidate and
# proves its tree before any write token exists, then opens the production pull request `release/<version>` into
# main through the writer App, and proves once more that the pull request's tree is exactly the candidate's tree.
#
# It runs unattended from dispatch to the pull request: the production pull request is the human approval gate. Any
# user with write access may dispatch it. It never tags, never creates a release and never touches pub.dev: no
# id-token, no tag, no force push. The App keys exist only in environments: this workflow uses `production-render`
# (no reviewers, deployments from `main` only); previews and the demo keep `render`. The reader token is revoked
# before any source code runs, the writer token is used by one step, and the job that holds it runs no repository
# code. Artifacts of this public repository are
# world-readable, so the bundle carries only public data: the rendered package, the native input and evidence
# (public marker facts), the candidate manifest, the generic consumer proof scripts and the standard-library
# module that verifies the public tree.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA of the reviewed private source (must be reachable from its main branch)
        required: true
        type: string

concurrency:
  group: render-production-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions: {}

env:
  FLUTTER_VERSION: "3.47.6"
  FLUTTER_MACOS_SHA256: "a1946d3b6b3de15ce247dc89649df9035ce29e6b4e7ebe91919a25890ea2e79a"
  FLUTTER_LINUX_SHA256: "f1631b9c2c8b3529323db412b0d1beacf4a748f8783b0d7cf599a8fd5f461675"
  SOURCE_SHA: ${{ inputs.source_sha }}
  # The private source repository, assembled from parts: this public tree must never spell its name.
  SOURCE_REPOSITORY_NAME: ${{ format('permate-attribution-{0}', 'sdk') }}
  SOURCE_REPOSITORY: ${{ format('{0}/permate-attribution-{1}', github.repository_owner, 'sdk') }}

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    environment: production-render
    permissions:
      contents: read
    outputs:
      candidate_sha256: ${{ steps.render.outputs.candidate_sha256 }}
      flutter_version: ${{ steps.render.outputs.flutter_version }}
      tree_digest: ${{ steps.render.outputs.tree_digest }}
    steps:
      - name: Check the inputs
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full lowercase commit" >&2; exit 1; }
      - name: Mint a read-only source token
        id: reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.READER_APP_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true
      - name: Require a commit that is merged into the source main branch
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          status=$(gh api "repos/${SOURCE_REPOSITORY}/compare/main...${SOURCE_SHA}" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "$SOURCE_SHA is not reachable from main (compare status: $status)" >&2; exit 1 ;;
          esac
      - name: Check out the private source at the exact commit with its history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.reader.outputs.token }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Revoke the source token before any source code runs
        if: always() && steps.reader.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: gh api -X DELETE /installation/token
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify the pinned native releases, render twice, scan and build the candidate
        id: render
        run: |
          set -eo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo "checkout is not the requested commit" >&2; exit 1; }
          mkdir -p bundle/scripts
          python3 source/scripts/flutter_production_inputs.py inputs --source-root source --source-sha "$SOURCE_SHA" \
            --output bundle/native-input.json --evidence-output bundle/evidence.json
          render() { python3 source/scripts/render-flutter-distribution.py render \
            --source source/flutter/permate_attribution --native-input bundle/native-input.json --verify-checkout --out "$1"; }
          render bundle/rendered > first.json
          render "$RUNNER_TEMP/second" > second.json
          cmp first.json second.json || { echo "render is not deterministic" >&2; exit 1; }
          python3 source/scripts/render-flutter-distribution.py scan --tree bundle/rendered --lane production > /dev/null
          python3 source/scripts/flutter_production_inputs.py ios-signature --native-input bundle/native-input.json \
            --evidence bundle/evidence.json --report bundle/ios-signature.json
          python3 source/scripts/flutter_release_candidate.py build --source-root source --native-input bundle/native-input.json \
            --evidence bundle/evidence.json --tree bundle/rendered --ios-signature-report bundle/ios-signature.json \
            --output bundle/candidate.json > summary.json
          python3 source/scripts/flutter_release_candidate.py validate --source-root source --manifest bundle/candidate.json \
            --tree bundle/rendered --native-input bundle/native-input.json > /dev/null
          # Byte order (LC_ALL=C): this list is built on macOS and compared on Linux, whose default collations differ.
          (cd bundle/rendered && find . -type f | LC_ALL=C sort) > bundle/rendered-files.txt
          mkdir -p bundle/verification
          cp source/scripts/flutter_public_tree.py bundle/scripts/
          cp -R source/verification/flutter-consumer bundle/verification/flutter-consumer
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["xcode"]["appPath"])' \
            source/release/ios-build-toolchain.json > bundle/xcode-app-path.txt
          field() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' summary.json "$1"; }
          echo "candidate_sha256=$(field candidateSha256)" >> "$GITHUB_OUTPUT"
          echo "flutter_version=$(field flutterVersion)" >> "$GITHUB_OUTPUT"
          echo "tree_digest=$(field treeDigest)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-bundle
          path: bundle
          retention-days: 7
          if-no-files-found: error

  android:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-bundle
          path: bundle
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the pinned Flutter SDK
        run: |
          url="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/flutter.tar.xz" "$url"
          echo "${FLUTTER_LINUX_SHA256}  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze and dry-run the rendered package
        run: bash bundle/verification/flutter-consumer/consumer.sh check bundle/rendered
      - name: Cold Android build on a clean consumer against the production Maven root
        run: bash bundle/verification/flutter-consumer/consumer.sh build bundle/rendered android bundle/native-input.json

  ios:
    needs: render
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-bundle
          path: bundle
      - name: Select the reviewed Xcode
        run: sudo xcode-select -s "$(cat bundle/xcode-app-path.txt)/Contents/Developer"
      - name: Install the pinned Flutter SDK
        run: |
          url="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/flutter.zip" "$url"
          echo "${FLUTTER_MACOS_SHA256}  $RUNNER_TEMP/flutter.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Cold iOS simulator build on a clean consumer against the production binary
        run: bash bundle/verification/flutter-consumer/consumer.sh build bundle/rendered ios bundle/native-input.json

  stage:
    needs: [render, android, ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.commit.outputs.release_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-bundle
          path: ${{ runner.temp }}/bundle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Overlay the rendered package on main and prove the result is exactly that package
        env:
          BUNDLE: ${{ runner.temp }}/bundle
        run: |
          git ls-files -z | grep -zv -e '^\.github/' -e '^SECURITY\.md$' | xargs -0 --no-run-if-empty git rm -q
          cp -R "$BUNDLE/rendered/." .
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo "the release must not change workflow files" >&2
            exit 1
          fi
          # Same file set and same bytes as the rendered, scanned package; only the governance files are extra.
          git ls-files | grep -v -e '^\.github/' -e '^SECURITY\.md$' | sed 's|^|./|' | LC_ALL=C sort > "$RUNNER_TEMP/committed-files.txt"
          cmp "$RUNNER_TEMP/committed-files.txt" "$BUNDLE/rendered-files.txt" \
            || { echo "committed file set differs from the rendered package" >&2; exit 1; }
          while IFS= read -r file; do
            cmp -s "$BUNDLE/rendered/$file" "$file" || { echo "committed file differs from the rendered package: $file" >&2; exit 1; }
          done < "$BUNDLE/rendered-files.txt"
      - name: Commit locally and prove the committed tree is the candidate, before any write token exists
        id: commit
        env:
          BUNDLE: ${{ runner.temp }}/bundle
          FLUTTER_RELEASE_VERSION: ${{ needs.render.outputs.flutter_version }}
        run: |
          set -eo pipefail
          [[ "$FLUTTER_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a stable version: $FLUTTER_RELEASE_VERSION" >&2; exit 1; }
          base=$(git rev-parse HEAD)
          git -c user.name="release-writer" -c user.email="release-writer@users.noreply.github.com" \
            commit -q -m "Release ${FLUTTER_RELEASE_VERSION} from ${SOURCE_SHA}"
          python3 "$BUNDLE/scripts/flutter_public_tree.py" verify --manifest "$BUNDLE/candidate.json" --repo . --rev HEAD
          git branch release-stage HEAD
          mkdir -p "$RUNNER_TEMP/stage"
          git bundle create "$RUNNER_TEMP/stage/release.bundle" "^${base}" release-stage
          echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-commit
          path: ${{ runner.temp }}/stage/release.bundle
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [render, stage]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-render
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.push.outputs.commit_sha }}
      pull_request: ${{ steps.push.outputs.pull_request }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-commit
          path: ${{ runner.temp }}/stage
      - name: Take exactly the staged commit, on the main it was staged on
        env:
          STAGED_COMMIT: ${{ needs.stage.outputs.release_commit }}
        run: |
          set -eo pipefail
          git fetch --quiet "$RUNNER_TEMP/stage/release.bundle" release-stage
          [[ "$(git rev-parse FETCH_HEAD)" == "$STAGED_COMMIT" ]] || { echo "the bundle is not the staged commit" >&2; exit 1; }
          [[ "$(git rev-list --count HEAD..FETCH_HEAD)" == "1" && "$(git rev-parse FETCH_HEAD^)" == "$(git rev-parse HEAD)" ]] \
            || { echo "main moved since the release commit was staged" >&2; exit 1; }
      - name: Mint a short-lived writer token
        id: writer
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.WRITER_APP_ID }}
          private-key: ${{ secrets.WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Push release/<version> and open the pull request into main
        id: push
        env:
          WRITER_TOKEN: ${{ steps.writer.outputs.token }}
          STAGED_COMMIT: ${{ needs.stage.outputs.release_commit }}
          FLUTTER_RELEASE_VERSION: ${{ needs.render.outputs.flutter_version }}
          CANDIDATE_SHA256: ${{ needs.render.outputs.candidate_sha256 }}
          TREE_DIGEST: ${{ needs.render.outputs.tree_digest }}
        run: |
          set -eo pipefail
          [[ "$FLUTTER_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a stable version: $FLUTTER_RELEASE_VERSION" >&2; exit 1; }
          auth=$(printf 'x-access-token:%s' "$WRITER_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "${STAGED_COMMIT}:refs/heads/release/${FLUTTER_RELEASE_VERSION}"
          body=$(printf 'Production candidate for permate_attribution %s.\n\n- candidate commit: %s\n- source commit: %s\n- candidate manifest SHA-256: %s\n- rendered tree digest: %s\n- workflow run: %s/%s/actions/runs/%s\n\nThe render, the clean Android and iOS consumer builds and the tree check passed before this pull request was opened. No tag and no publication happen from this pull request.' \
            "$FLUTTER_RELEASE_VERSION" "$STAGED_COMMIT" "$SOURCE_SHA" "$CANDIDATE_SHA256" "$TREE_DIGEST" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          url=$(GH_TOKEN="$WRITER_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            -f title="Release permate_attribution ${FLUTTER_RELEASE_VERSION}" -f head="release/${FLUTTER_RELEASE_VERSION}" \
            -f base=main -f body="$body" --jq .html_url)
          echo "commit_sha=${STAGED_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "pull_request=$url" >> "$GITHUB_OUTPUT"

  verify-tree:
    needs: [render, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.publish.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-bundle
          path: bundle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Prove the pull request's committed tree is the candidate
        env:
          COMMIT_SHA: ${{ needs.publish.outputs.commit_sha }}
          PULL_REQUEST: ${{ needs.publish.outputs.pull_request }}
          CANDIDATE_SHA256: ${{ needs.render.outputs.candidate_sha256 }}
        run: |
          set -eo pipefail
          [[ "$(git rev-parse HEAD)" == "$COMMIT_SHA" ]] || { echo "checkout is not the release commit" >&2; exit 1; }
          python3 bundle/scripts/flutter_public_tree.py verify --manifest bundle/candidate.json --repo . --rev HEAD | tee bundle/public-tree.json
          {
            echo "### Production candidate"
            echo "- pull request: ${PULL_REQUEST}"
            echo "- release commit: ${COMMIT_SHA}"
            echo "- candidate manifest SHA-256: ${CANDIDATE_SHA256}"
            echo "- the committed tree equals the candidate tree; no tag, no publication"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-release-candidate
          path: |
            bundle/candidate.json
            bundle/native-input.json
            bundle/evidence.json
            bundle/ios-signature.json
            bundle/public-tree.json
          retention-days: 90
          if-no-files-found: error
