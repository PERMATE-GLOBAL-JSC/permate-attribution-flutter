name: permate_attribution
description: Flutter bridge for the Permate mobile attribution SDK (Android and iOS native binaries).
version: 3.2.1-preview.37911246568
homepage: https://permate.com
repository: https://github.com/PERMATE-GLOBAL-JSC/permate-attribution-flutter
issue_tracker: https://github.com/PERMATE-GLOBAL-JSC/permate-attribution-flutter/issues

environment:
  sdk: ^3.11.4
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.1.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.permate.attribution.permate_attribution
        pluginClass: PermateAttributionPlugin
      ios:
        pluginClass: PermateAttributionPlugin
